services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-agent-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: support_agent
      DB_USERNAME: support
      DB_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - support-agent-net

  nginx:
    image: nginx:1.27-alpine
    container_name: support-agent-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - support-agent-net

  mysql:
    image: mysql:8.4
    container_name: support-agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: support_agent
      MYSQL_USER: support
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3310:3306"
    volumes:
      - support_agent_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - support-agent-net

  redis:
    image: redis:7-alpine
    container_name: support-agent-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    networks:
      - support-agent-net

volumes:
  support_agent_mysql_data:

networks:
  support-agent-net:
    driver: bridge
